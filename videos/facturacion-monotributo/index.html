<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Georgia no se distribuye en Linux: Gelasio es su clon métrico libre (OFL). */
      @font-face { font-family: "Gelasio"; src: url("assets/fonts/gelasio-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Gelasio"; src: url("assets/fonts/gelasio-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Gelasio"; src: url("assets/fonts/gelasio-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-300-normal.woff2") format("woff2"); font-weight: 300; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); font-weight: 700; }

      /* Paleta Contax-AI (ver CLAUDE.md en la raíz del repo) */
      :root {
        --profundo: #31424b;
        --azul-inst: #4c636d;
        --aire: #819aa2;
        --bruma: #9fb8bf;
        --tierra: #69594a;
        --azul-marca: #2c80c6; /* solo isotipo / micro-acentos */
        --papel: #f9f8f6;
        --papel-2: #f2efea;
        --borde: #e4e0d9;
        --blanco: #ffffff;
        --serif: "Gelasio", Georgia, serif;
        --sans: "Poppins", sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--papel); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--sans); color: var(--profundo); background: var(--papel); }

      /* ---------- sistema tipográfico compartido por las escenas ---------- */
      .scene-content { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 300px 96px 330px; gap: 56px; }
      .meta { display: flex; align-items: center; gap: 22px; font-size: 26px; font-weight: 600; letter-spacing: 0.3em; color: var(--azul-inst); }
      .meta .dash { width: 64px; height: 4px; background: var(--azul-marca); border-radius: 2px; transform-origin: left center; }
      .meta .num { font-family: var(--serif); font-weight: 700; font-size: 40px; letter-spacing: 0; color: var(--profundo); }
      .headline { font-family: var(--serif); font-weight: 700; font-size: 112px; line-height: 1.06; letter-spacing: -0.015em; color: var(--profundo); }
      .headline .w { display: inline-block; }
      .headline .em { position: relative; display: inline-block; font-style: italic; font-weight: 400; color: var(--azul-inst); }
      .headline .em .t { position: relative; }
      .headline .em .ul { position: absolute; left: 0; right: 0; bottom: 6px; height: 22px; background: var(--bruma); opacity: 0.45; transform-origin: left center; border-radius: 4px; }
      .sub { font-family: var(--sans); font-weight: 400; font-size: 46px; line-height: 1.32; color: var(--azul-inst); max-width: 860px; }
      .sub b { font-weight: 600; color: var(--profundo); }
      .visual { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
      .card { background: var(--blanco); border: 2px solid var(--borde); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <!-- Fondo claro compartido (escenas 1–4; el cierre lo tapa con Profundo) -->
      <div id="fondo" data-composition-id="fondo" data-composition-src="compositions/fondo.html"
        data-start="0" data-duration="15.6" data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="s1" data-composition-id="s1-gancho" data-composition-src="compositions/s1-gancho.html"
        data-start="0" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s2" data-composition-id="s2-factura-c" data-composition-src="compositions/s2-factura-c.html"
        data-start="3" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s3" data-composition-id="s3-cada-venta" data-composition-src="compositions/s3-cada-venta.html"
        data-start="7" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s4" data-composition-id="s4-tope" data-composition-src="compositions/s4-tope.html"
        data-start="11" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div id="s5" data-composition-id="s5-cierre" data-composition-src="compositions/s5-cierre.html"
        data-start="15" data-duration="3" data-track-index="2" data-width="1080" data-height="1920"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
